<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styleLogin.css">
</head>
<body>
    <div class="container">
        <h1>Acesse Seu KPI</h1>
        <form id="loginForm">
            <img src="logo-semfundo.png" alt="Logo" height="50px">
            <div class="input-group">
                <span class="textUsuario">ID Usuário</span>
                <label for="codigo"></label>
                <input class="input-codigo" type="text" id="codigo" name="codigo" required placeholder="Digite seu código">
                <span class="textSenha">Senha</span>
                <label for="senha"></label>
                <input class="input-senha" type="password" id="senha" name="senha" required placeholder="Digite sua senha">
            </div>
            <!-- Botão corrigido: adicionado id="botaoLogin" e type="submit" -->
            <button id="botaoLogin" type="submit">Entrar</button>
            <div id="mensagemErro" style="color: red; margin-top: 10px;"></div>
        </form>
    </div>
    <script src="loginscript.js"></script>
</body>
</html>
